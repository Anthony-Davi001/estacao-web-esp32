<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Estação do Clima Web</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { 
            background-color: #f8f9fa; 
            height: 100vh; 
        }
        .login-container { 
            max-width: 400px; 
            width: 100%; 
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">

    <div class="login-container p-4 bg-white rounded shadow-sm">
        <h2 class="text-center mb-4 text-primary fw-bold">
            <i class="bi bi-cpu-fill"></i> Estação do Clima Web
        </h2>
        
        <!-- Feedback Alert Container -->
        <div id="alertMessage" class="alert d-none shadow-sm" role="alert"></div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="mb-3">
                <label for="emailInput" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="emailInput" placeholder="nome@exemplo.com" required>
            </div>
            <div class="mb-3">
                <label for="passwordInput" class="form-label">Senha</label>
                <input type="password" class="form-control" id="passwordInput" placeholder="Sua senha" required>
            </div>
            
            <button type="submit" id="btnSubmit" class="btn btn-primary w-100 py-2 fw-semibold">
                <span id="btnText"><i class="bi bi-box-arrow-in-right"></i> Entrar</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
        </form>

        <hr class="my-4 text-muted opacity-25">

        <!-- Create Account Button Container -->
        <div class="text-center">
            <p class="small text-muted mb-2">Ainda não possui uma conta?</p>
            <a href="register.html" id="btnCreateAccount" class="btn btn-outline-secondary w-100 py-2 fw-semibold">
                <i class="bi bi-person-plus-fill"></i> Criar uma Conta
            </a>
        </div>
    </div>

    <!-- Firebase Script Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            query, 
            where, 
            getDocs 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDq2L321nt_mA20C5jsQTarXU_VhFqJwhY",
            authDomain: "estacao-esp32-d1567.firebaseapp.com",
            projectId: "estacao-esp32-d1567",
            storageBucket: "estacao-esp32-d1567.firebasestorage.app",
            messagingSenderId: "1005042474762",
            appId: "1:1005042474762:web:025780d7e6336324df24f3",
            measurementId: "G-SL6B0LB6HB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const alertMessage = document.getElementById('alertMessage');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        // Check active session and redirect if already logged in
        if (localStorage.getItem('usuarioLogado')) {
            window.location.href = "dashboard.html";
        }

        // Helper function to display alert messages
        function displayMessage(text, type) {
            alertMessage.innerText = text;
            alertMessage.className = `alert alert-${type} shadow-sm`;
            alertMessage.classList.remove('d-none');
        }

        // Login Submit Event Listener
        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const enteredEmail = document.getElementById('emailInput').value.trim();
            const enteredPassword = document.getElementById('passwordInput').value.trim();

            btnSubmit.disabled = true;
            btnText.innerText = "Verificando...";
            btnSpinner.classList.remove('d-none');
            alertMessage.classList.add('d-none');

            try {
                // Query user credentials in Firestore
                const userQuery = query(
                    collection(db, "users"), 
                    where("email", "==", enteredEmail),
                    where("password", "==", enteredPassword)
                );

                const querySnapshot = await getDocs(userQuery);

                if (!querySnapshot.empty) {
                    let authenticatedUser = null;

                    querySnapshot.forEach((doc) => {
                        authenticatedUser = { id: doc.id, ...doc.data() };
                    });

                    // Store user data in localStorage
                    localStorage.setItem('usuarioLogado', JSON.stringify(authenticatedUser));
                    
                    console.log("User authenticated successfully:", authenticatedUser);
                    displayMessage("Login efetuado! Redirecionando...", "success");
                    
                    // Redirect to dashboard after 1 second
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1000);

                } else {
                    displayMessage("E-mail ou senha incorretos.", "danger");
                    btnSubmit.disabled = false;
                    btnText.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Entrar';
                    btnSpinner.classList.add('d-none');
                }

            } catch (error) {
                console.error("Database connection error:", error);
                displayMessage("Erro de conexão ao banco de dados.", "danger");
                btnSubmit.disabled = false;
                btnText.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Entrar';
                btnSpinner.classList.add('d-none');
            }
        });
    </script>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
