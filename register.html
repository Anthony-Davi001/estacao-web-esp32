<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Estação do Clima Web</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { 
            background-color: #f8f9fa; 
            min-height: 100vh; 
        }
        .register-container { 
            max-width: 450px; 
            width: 100%; 
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">

    <div class="register-container p-4 bg-white rounded shadow-sm">
        <h2 class="text-center mb-1 text-primary fw-bold">
            <i class="bi bi-cpu-fill"></i> Estação do Clima Web
        </h2>
        <p class="text-center text-muted small mb-4">Crie sua conta para acessar a plataforma</p>
        
        <!-- Feedback Alert Container -->
        <div id="alertMessage" class="alert d-none shadow-sm" role="alert"></div>

        <!-- Registration Form -->
        <form id="registerForm">
            <div class="mb-3">
                <label for="emailInput" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="emailInput" placeholder="nome@exemplo.com" required>
            </div>
            
            <div class="mb-3">
                <label for="passwordInput" class="form-label">Senha</label>
                <input type="password" class="form-control" id="passwordInput" placeholder="Mínimo 6 caracteres" minlength="6" required>
            </div>

            <div class="mb-3">
                <label for="confirmPasswordInput" class="form-label">Confirmar Senha</label>
                <input type="password" class="form-control" id="confirmPasswordInput" placeholder="Repita sua senha" minlength="6" required>
            </div>
            
            <button type="submit" id="btnSubmit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
                <span id="btnText"><i class="bi bi-person-check-fill"></i> Cadastrar</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
        </form>

        <hr class="my-4 text-muted opacity-25">

        <!-- Login Redirect Container -->
        <div class="text-center">
            <p class="small text-muted mb-2">Já possui uma conta?</p>
            <a href="index.html" id="btnLoginRedirect" class="btn btn-outline-secondary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right"></i> Voltar para o Login
            </a>
        </div>
    </div>

    <!-- Firebase Script Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            query, 
            where, 
            getDocs,
            addDoc,
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDq2L321nt_mA20C5jsQTarXU_VhFqJwhY",
            authDomain: "estacao-esp32-d1567.firebaseapp.com",
            projectId: "estacao-esp32-d1567",
            storageBucket: "estacao-esp32-d1567.firebasestorage.app",
            messagingSenderId: "1005042474762",
            appId: "1:1005042474762:web:025780d7e6336324df24f3",
            measurementId: "G-SL6B0LB6HB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // DOM Elements
        const registerForm = document.getElementById('registerForm');
        const alertMessage = document.getElementById('alertMessage');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        // Helper function to display alert messages
        function displayMessage(text, type) {
            alertMessage.innerText = text;
            alertMessage.className = `alert alert-${type} shadow-sm`;
            alertMessage.classList.remove('d-none');
        }

        // Register Submit Event Listener
        registerForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const enteredEmail = document.getElementById('emailInput').value.trim();
            const enteredPassword = document.getElementById('passwordInput').value.trim();
            const confirmedPassword = document.getElementById('confirmPasswordInput').value.trim();

            // Validate password match
            if (enteredPassword !== confirmedPassword) {
                displayMessage("As senhas não coincidem. Digite novamente.", "warning");
                return;
            }

            btnSubmit.disabled = true;
            btnText.innerText = "Criando conta...";
            btnSpinner.classList.remove('d-none');
            alertMessage.classList.add('d-none');

            try {
                // Check if email already exists in Firestore
                const existingUserQuery = query(
                    collection(db, "users"), 
                    where("email", "==", enteredEmail)
                );
                const existingUserSnapshot = await getDocs(existingUserQuery);

                if (!existingUserSnapshot.empty) {
                    displayMessage("Este e-mail já está cadastrado.", "danger");
                    btnSubmit.disabled = false;
                    btnText.innerHTML = '<i class="bi bi-person-check-fill"></i> Cadastrar';
                    btnSpinner.classList.add('d-none');
                    return;
                }

                // Create new user document in 'users' collection
                const newUserDoc = await addDoc(collection(db, "users"), {
                    email: enteredEmail,
                    password: enteredPassword,
                    created_at: serverTimestamp()
                });

                console.log("New user registered successfully with ID:", newUserDoc.id);
                displayMessage("Conta criada com sucesso! Redirecionando para o login...", "success");

                // Redirect to login page after 1.5 seconds
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);

            } catch (error) {
                console.error("Error creating user account:", error);
                displayMessage("Erro ao criar conta: " + error.message, "danger");
                btnSubmit.disabled = false;
                btnText.innerHTML = '<i class="bi bi-person-check-fill"></i> Cadastrar';
                btnSpinner.classList.add('d-none');
            }
        });
    </script>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
